<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="forms.css">
</head>

<body>
    <div class="container">
        <h2>Login</h2>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input id="username">
                <div class="error" id="usernameError"></div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password">
                <div class="error" id="passwordError"></div>
            </div>

            <button type="submit">Login</button>
        </form>

        <div class="footer">
            Don’t have an account? <a href="signup.html">Sign up</a>
        </div>
    </div>

    <script src="forms.js"></script>
    <script>
        const Controller = {
            init() {
                document.getElementById('loginForm')
                    .addEventListener('submit', (e) => {
                        e.preventDefault();
                        this.submit();
                    });
            },

            submit() {
                const email = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                const emailErrEl = document.getElementById('usernameError');
                const passErrEl = document.getElementById('passwordError');

                View.clearErrors([emailErrEl, passErrEl]);

                let valid = true;

                const emailError = Model.validateEmail(email);
                if (emailError) {
                    View.showError(emailErrEl, emailError);
                    valid = false;
                }

                const passError = Model.validatePassword(password);
                if (passError) {
                    View.showError(passErrEl, passError);
                    valid = false;
                }

                if (valid) {
                    alert(`Username: ${email} | Password: ${password}`);
                }
            }
        };

        Controller.init();
    </script>
</body>

</html>
